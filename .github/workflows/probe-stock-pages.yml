name: Probe stock Pages

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/probe-stock-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe static host URLs
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            NAME="$1"
            URL="$2"
            BODY="/tmp/${NAME}.html"
            CODE="$(curl -L -sS --max-time 20 -o "$BODY" -w '%{http_code}' "$URL" || true)"
            TITLE=false
            if grep -Fq '<title>KIS Stock</title>' "$BODY" 2>/dev/null; then TITLE=true; fi
            echo "${NAME}_url=${URL}"
            echo "${NAME}_http_code=${CODE}"
            echo "${NAME}_title_ok=${TITLE}"
          }
          {
            probe rawgithack 'https://raw.githack.com/Soo92/mysite-main/main/stock/index.html'
            probe htmlpreview 'https://htmlpreview.github.io/?https://github.com/Soo92/mysite-main/blob/main/stock/index.html'
            probe jsdelivr 'https://cdn.jsdelivr.net/gh/Soo92/mysite-main@main/stock/index.html'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > stock-pages-probe.txt
      - name: Save probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-pages-probe.txt
          git commit -m 'ci: record stock static host probe' || exit 0
          git push origin HEAD:main
