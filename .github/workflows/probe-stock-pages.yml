name: Probe stock Pages

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/probe-stock-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe live URLs
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            NAME="$1"
            URL="$2"
            BODY="/tmp/${NAME}.html"
            CODE="$(curl -L -sS --max-time 20 -o "$BODY" -w '%{http_code}' "${URL}?probe=${GITHUB_SHA}" || true)"
            echo "${NAME}_url=${URL}"
            echo "${NAME}_http_code=${CODE}"
          }
          {
            probe workout_root 'https://soo92.github.io/workout/'
            probe workout_stock 'https://soo92.github.io/workout/stock/'
            probe mysite_main 'https://soo92.github.io/mysite-main/'
            probe mysite 'https://soo92.github.io/mysite/'
            probe portfolio 'https://soo92.github.io/portfolio/'
            probe cv 'https://soo92.github.io/cv/'
            probe searchportal 'https://soo92.github.io/SearchPortal/'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > stock-pages-probe.txt
      - name: Save probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-pages-probe.txt
          git commit -m 'ci: record stock Pages probe' || exit 0
          git push origin HEAD:main
