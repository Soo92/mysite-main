name: Probe stock Pages

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/probe-stock-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe live URLs
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            NAME="$1"
            URL="$2"
            EXPECT="$3"
            BODY="/tmp/${NAME}.html"
            CODE="$(curl -L -sS --max-time 20 -o "$BODY" -w '%{http_code}' "${URL}?probe=${GITHUB_SHA}" || true)"
            TITLE_OK=false
            if grep -Fq "$EXPECT" "$BODY" 2>/dev/null; then TITLE_OK=true; fi
            echo "${NAME}_url=${URL}"
            echo "${NAME}_http_code=${CODE}"
            echo "${NAME}_title_ok=${TITLE_OK}"
          }
          {
            probe root 'https://soo92.github.io/workout/' '<title>Workout App'
            probe stock 'https://soo92.github.io/workout/stock/' '<title>KIS Stock</title>'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > stock-pages-probe.txt
      - name: Save probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-pages-probe.txt
          git commit -m 'ci: record stock Pages probe' || exit 0
          git push origin HEAD:main
